<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="35%" stop-color="#E5C869" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997715" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Dark Background -->
  <circle cx="100" cy="100" r="100" fill="#0A0A0C" />
  
  <!-- Hairline Gold Ring -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Butterfly Icon -->
  <g transform="translate(100, 94) scale(0.72)" filter="url(#goldGlow)">
    <!-- Body & Head -->
    <ellipse cx="0" cy="0" rx="2.5" ry="24" fill="url(#goldGradient)" />
    <circle cx="0" cy="-28" r="4.5" fill="url(#goldGradient)" />
    <!-- Antennae -->
    <path d="M-2 -32 C -8 -44, -18 -48, -24 -46 C -20 -44, -15 -42, -5 -33" fill="none" stroke="url(#goldGradient)" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="-24" cy="-46" r="1.8" fill="url(#goldGradient)" />
    <path d="M2 -32 C 8 -44, 18 -48, 24 -46 C 20 -44, 15 -42, 5 -33" fill="none" stroke="url(#goldGradient)" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="24" cy="-46" r="1.8" fill="url(#goldGradient)" />

    <!-- Left Upper Wing -->
    <path d="M-2 -8 C -25 -52, -68 -56, -82 -32 C -92 -12, -74 22, -3 8 Z" fill="url(#goldGradient)" fill-opacity="0.9" />
    <!-- Left Inner Wing Cuts -->
    <path d="M-10 -14 C -30 -38, -60 -40, -70 -24 C -60 -12, -40 2, -10 -2 Z" fill="#0A0A0C" />
    <path d="M-15 -6 C -35 -14, -54 -10, -58 4 C -48 10, -30 10, -12 2 Z" fill="url(#goldGradient)" fill-opacity="0.6" />
    
    <!-- Right Upper Wing -->
    <path d="M2 -8 C 25 -52, 68 -56, 82 -32 C 92 -12, 74 22, 3 8 Z" fill="url(#goldGradient)" fill-opacity="0.9" />
    <!-- Right Inner Wing Cuts -->
    <path d="M10 -14 C 30 -38, 60 -40, 70 -24 C 60 -12, 40 2, 10 -2 Z" fill="#0A0A0C" />
    <path d="M15 -6 C 35 -14, 54 -10, 58 4 C 48 10, 30 10, 12 2 Z" fill="url(#goldGradient)" fill-opacity="0.6" />

    <!-- Left Lower Wing -->
    <path d="M-2 4 C -22 18, -54 26, -58 48 C -60 64, -38 74, -18 64 C -8 58, -3 36, -2 14 Z" fill="url(#goldGradient)" fill-opacity="0.85" />
    <path d="M-8 14 C -22 26, -42 34, -44 48 C -42 56, -28 58, -14 50 C -8 44, -6 28, -6 18 Z" fill="#0A0A0C" />

    <!-- Right Lower Wing -->
    <path d="M2 4 C 22 18, 54 26, 58 48 C 60 64, 38 74, 18 64 C 8 58, 3 36, 2 14 Z" fill="url(#goldGradient)" fill-opacity="0.85" />
    <path d="M8 14 C 22 26, 42 34, 44 48 C 42 56, 28 58, 14 50 C 8 44, 6 28, 6 18 Z" fill="#0A0A0C" />
  </g>

  <!-- Wordmark at bottom -->
  <text x="100" y="172" font-family="'Syne', 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="6" fill="url(#goldGradient)" text-anchor="middle">JUNU</text>
</svg>
